<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 5 — 공통 UI ⑤ 가운데 시계</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">여러 화면에 걸쳐 늘 보이는 요소의 배치. 회색조 배치도이며 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="560" y="480" width="800" height="120" fill="none" stroke="#888" stroke-width="2"/><text x="960" y="549" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">공방 화면 (공방 시트에서 고른다)</text>
<rect x="548" y="8" width="824" height="88" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
<rect x="560" y="20" width="210" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="665" y="59.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">평판 00</text>
<rect x="782" y="12" width="356" height="80" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="960" y="61" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">1일차 · 9분 59초</text>
<rect x="1150" y="20" width="210" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1255" y="59.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">0,000 G</text>
<rect x="660" y="104" width="600" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="960" y="143.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">알림이 시계 아래로 내려온다 (뜰 때만)</text>
<rect x="1804" y="16" width="92" height="64" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="1850" y="55.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">메뉴</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="298.0" y="1464.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="294.4" y="1322.4" width="247.2" height="26.4" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="298.0" y="1326.0" width="63.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="364.6" y="1323.6" width="106.8" height="24.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="475.0" y="1326.0" width="63.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="328.0" y="1351.2" width="180.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="761.2" y="1324.8" width="27.6" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="1108.0" y="1482.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="1104.4" y="1322.4" width="247.2" height="26.4" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="1108.0" y="1326.0" width="63.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1174.6" y="1323.6" width="106.8" height="24.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="1285.0" y="1326.0" width="63.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1138.0" y="1351.2" width="180.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1481.2" y="1324.8" width="27.6" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 하루의 시계를 화면 위쪽 가운데에 가장 크게 두고,</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">돈과 평판을 그 양옆에 붙인다. 시간에 쫓기는 느낌을</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">앞세운다.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 뭉치는 항상 가운데에 있어 화면이 넓어져도</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리가 변하지 않는다. 메뉴만 오른쪽 위 끝을 따라간다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 뭉치의 양옆에 칸을 붙이거나</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">뗀다. 좌우 균형이 맞아야 해서 홀수 개가 되면 어색하다.</text>
<text x="2000" y="804" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 알림은 시계 아래로 내려왔다가 사라지므로, 뜨는 동안</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공방의 위쪽 가운데를 가린다.</text>
<text x="2000" y="882" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 좌우 가장자리와 아래쪽이 모두 비어, 가장자리를 쓰는</text>
<text x="2000" y="916" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공방(시트 ⑤)과 잘 맞는다.</text>
</svg>