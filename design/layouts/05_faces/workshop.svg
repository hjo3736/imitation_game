<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1911" width="2760" height="1911" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1911" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 5 — 공방 화면 ⑤ 넘기는 방</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">공방 화면 고유의 배치. 공통 UI의 자리는 비워 두고 윤곽만 그렸다. 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="0" y="0" width="1920" height="104" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="59.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (위 104)</text>
<rect x="0" y="984" width="1920" height="96" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="1039.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (아래 96)   ·   공통 UI ④(왼쪽 레일)를 고르면 왼쪽 200도 쓴다</text>
<rect x="40" y="420" width="124" height="240" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="102" y="496.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">◀</text><text x="102" y="530.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">응접 면</text><text x="102" y="564.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">새 의뢰</text><text x="102" y="598.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">표시</text>
<rect x="220" y="200" width="300" height="660" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="370" y="520.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 화집 선반</text><text x="370" y="554.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 선택으로</text>
<rect x="580" y="150" width="760" height="760" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="960" y="503.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">작업대 (이젤)</text><text x="960" y="537.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">진행 중인 작품</text><text x="960" y="571.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">공정 진행 표시</text>
<rect x="1400" y="200" width="300" height="660" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1550" y="520.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">도구장</text><text x="1550" y="554.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">업그레이드로</text>
<rect x="1756" y="420" width="124" height="240" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1818" y="496.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">▶</text><text x="1818" y="530.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">창고 면</text><text x="1818" y="564.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매</text><text x="1818" y="598.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">현황</text>
<rect x="840" y="924" width="240" height="48" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="960" y="955.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">면 표시  ○ ● ○</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="40.0" y="1320.0" width="756.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="40.0" y="1615.2" width="756.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="52.0" y="1446.0" width="37.2" height="72.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="196.0" y="1380.0" width="90.0" height="198.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="304.0" y="1365.0" width="228.0" height="228.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="550.0" y="1380.0" width="90.0" height="198.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="746.8" y="1446.0" width="37.2" height="72.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="382.0" y="1597.2" width="72.0" height="14.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="940.0" y="1320.0" width="576.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="940.0" y="1651.2" width="576.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="952.0" y="1464.0" width="37.2" height="72.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1006.0" y="1398.0" width="90.0" height="198.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1114.0" y="1383.0" width="228.0" height="228.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1360.0" y="1398.0" width="90.0" height="198.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1466.8" y="1464.0" width="37.2" height="72.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1192.0" y="1615.2" width="72.0" height="14.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="486" font-size="24" text-anchor="start" fill="#111" font-weight="normal">왼쪽 면 — 응접 면</text><rect x="2000" y="500" width="633.6" height="356.40000000000003" fill="#fafafa" stroke="#222" stroke-width="3"/><rect x="2085.8" y="566.0" width="105.6" height="237.6" fill="#cfcfcf" stroke="#222" stroke-width="2"/><text x="2138.6000000000004" y="678.8" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">문</text><text x="2138.6000000000004" y="706.8" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">명패</text><rect x="2231.0" y="566.0" width="250.8" height="165.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/><text x="2356.4" y="642.5" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">의뢰 게시판</text><text x="2356.4" y="670.5" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">의뢰 목록으로</text><rect x="2579.5" y="638.6" width="40.9" height="79.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/><text x="2599.94" y="686.2" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">▶</text>
<text x="2000" y="912.4000000000001" font-size="24" text-anchor="start" fill="#111" font-weight="normal">오른쪽 면 — 창고 면</text><rect x="2000" y="926.4000000000001" width="633.6" height="356.40000000000003" fill="#fafafa" stroke="#222" stroke-width="3"/><rect x="2013.2" y="1065.0" width="40.9" height="79.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/><text x="2033.66" y="1112.6" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">◀</text><rect x="2079.2" y="985.8" width="270.6" height="244.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/><text x="2214.5" y="1115.9" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">완성작 보관함</text><rect x="2369.6" y="985.8" width="184.8" height="244.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/><text x="2462" y="1101.9" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">판매 창구</text><text x="2462" y="1129.9" font-size="22" text-anchor="middle" fill="#111" font-weight="normal">경로 선택 · 현황</text>
<text x="2000" y="1356.8000000000002" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="1398.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 공방을 화면 세 장 너비의 방으로 보고, 좌우</text>
<text x="2000" y="1432.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">화살표로 면을 넘긴다. 한 면에 물건이 적어 크게 놓인다. 큰</text>
<text x="2000" y="1466.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">그림은 가운데 면(작업 면)이다.</text>
<text x="2000" y="1510.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 하루의 움직임: 가운데 면에서 만들고, 왼쪽 면에서 의뢰를</text>
<text x="2000" y="1544.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">받고 하루를 끝내며, 오른쪽 면에서 보관하고 판다. 면을</text>
<text x="2000" y="1578.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">넘기는 클릭이 한 번씩 더 든다.</text>
<text x="2000" y="1622.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 화살표는 실제 화면의 좌우 끝을 따라가고, 물건은</text>
<text x="2000" y="1656.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">가운데에 고정된다.</text>
<text x="2000" y="1700.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 면에 빈 곳이 많아 잘 받는다.</text>
<text x="2000" y="1734.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">많아지면 면을 하나 더 늘릴 수 있다.</text>
<text x="2000" y="1778.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 보이지 않는 면의 소식(새 의뢰, 판매 현황)은 화살표에</text>
<text x="2000" y="1812.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">표시해야 놓치지 않는다. 문이 다른 면에 있어 하루 끝내기가</text>
<text x="2000" y="1846.8000000000002" font-size="24" text-anchor="start" fill="#111" font-weight="normal">한 걸음 멀다.</text>
</svg>