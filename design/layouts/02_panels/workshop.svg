<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 2 — 공방 화면 ② 목록과 패널</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">공방 화면 고유의 배치. 공통 UI의 자리는 비워 두고 윤곽만 그렸다. 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="0" y="0" width="1920" height="104" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="59.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (위 104)</text>
<rect x="0" y="984" width="1920" height="96" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="1039.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (아래 96)   ·   공통 UI ④(왼쪽 레일)를 고르면 왼쪽 200도 쓴다</text>
<rect x="40" y="112" width="560" height="560" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="320" y="365.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">의뢰</text><text x="320" y="399.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">새 의뢰 표시 · 대기 중인 의뢰 요약</text><text x="320" y="433.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">[ 의뢰 목록으로 ]</text>
<rect x="40" y="696" width="560" height="280" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="320" y="826.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 선택</text><text x="320" y="860.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">[ 원작 선택으로 ]</text>
<rect x="624" y="112" width="672" height="864" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="960" y="517.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">작업대</text><text x="960" y="551.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">진행 중인 작품 · 공정 진행 표시</text><text x="960" y="585.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">[ 작업 이어 하기 ]</text>
<rect x="1320" y="112" width="560" height="400" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1600" y="302.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">완성작 보관함</text><text x="1600" y="336.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">완성작 목록 (줄 수는 미정)</text>
<rect x="1320" y="536" width="560" height="248" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1600" y="633.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매</text><text x="1600" y="667.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">[ 판매 경로 선택으로 ]</text><text x="1600" y="701.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">[ 판매 현황으로 ]</text>
<rect x="1320" y="808" width="268" height="168" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1454" y="899.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">업그레이드로</text>
<rect x="1612" y="808" width="268" height="168" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="1746" y="882.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">문 · 명패</text><text x="1746" y="916.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(하루 끝내기)</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="40.0" y="1320.0" width="756.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="40.0" y="1615.2" width="756.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="142.0" y="1353.6" width="168.0" height="168.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="142.0" y="1528.8" width="168.0" height="84.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="317.2" y="1353.6" width="201.6" height="259.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1353.6" width="168.0" height="120.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1480.8" width="168.0" height="74.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1562.4" width="80.4" height="50.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="613.6" y="1562.4" width="80.4" height="50.4" fill="#8c8c8c" stroke="#222" stroke-width="2"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="940.0" y="1320.0" width="576.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="940.0" y="1651.2" width="576.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="952.0" y="1371.6" width="168.0" height="168.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="952.0" y="1546.8" width="168.0" height="84.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1127.2" y="1371.6" width="201.6" height="259.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1371.6" width="168.0" height="120.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1498.8" width="168.0" height="74.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1580.4" width="80.4" height="50.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1423.6" y="1580.4" width="80.4" height="50.4" fill="#8c8c8c" stroke="#222" stroke-width="2"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 공방을 그림이 아니라 상황판으로 본다. 요소마다</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">패널 하나를 주고, 패널 안에 지금 상태를 글과 목록으로</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">적는다.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 하루의 움직임: 눈은 세 단을 훑어 상태를 읽고, 마우스는</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">필요한 패널의 버튼으로 바로 간다. 다른 화면에 들어가지</text>
<text x="2000" y="716" font-size="24" text-anchor="start" fill="#111" font-weight="normal">않고도 대부분의 상태가 보인다.</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 세 단은 가운데에 고정된다. 넓어진 곳은 배경이</text>
<text x="2000" y="794" font-size="24" text-anchor="start" fill="#111" font-weight="normal">채운다.</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 패널을 하나 빼면 같은 단의</text>
<text x="2000" y="872" font-size="24" text-anchor="start" fill="#111" font-weight="normal">패널이 늘어나 메우고, 더하면 단을 나눈다. 다섯 가운데</text>
<text x="2000" y="906" font-size="24" text-anchor="start" fill="#111" font-weight="normal">가장 잘 받는다.</text>
<text x="2000" y="950" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 패널 안에 몇 줄을 보일지는 정해지지 않았다. 목록의</text>
<text x="2000" y="984" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 그렸다.</text>
</svg>