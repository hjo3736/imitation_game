<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 2 — 공통 UI ② 상단 띠</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">여러 화면에 걸쳐 늘 보이는 요소의 배치. 회색조 배치도이며 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="560" y="480" width="800" height="120" fill="none" stroke="#888" stroke-width="2"/><text x="960" y="549" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">공방 화면 (공방 시트에서 고른다)</text>
<rect x="0" y="0" width="1920" height="80" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
<rect x="24" y="8" width="150" height="64" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="99" y="47.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">1일차</text>
<rect x="186" y="8" width="440" height="64" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="406" y="47.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">남은 시간 9분 59초 ▬▬▬▬</text>
<rect x="660" y="8" width="600" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="960" y="47.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">알림 한 줄 (예: 판매 완료)</text>
<rect x="1300" y="8" width="200" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1400" y="47.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">평판 00</text>
<rect x="1512" y="8" width="280" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1652" y="47.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">보유 금액 0,000 G</text>
<rect x="1804" y="8" width="92" height="64" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="1850" y="47.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">메뉴</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="298.0" y="1464.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="40.0" y="1320.0" width="756.0" height="24.0" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="47.2" y="1322.4" width="45.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="95.8" y="1322.4" width="132.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="328.0" y="1322.4" width="180.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="610.0" y="1322.4" width="60.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="673.6" y="1322.4" width="84.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="761.2" y="1322.4" width="27.6" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="1108.0" y="1482.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="940.0" y="1320.0" width="576.0" height="24.0" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="947.2" y="1322.4" width="45.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="995.8" y="1322.4" width="132.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="1138.0" y="1322.4" width="180.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1330.0" y="1322.4" width="60.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1393.6" y="1322.4" width="84.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1481.2" y="1322.4" width="27.6" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 모든 정보를 위쪽 띠 하나에 한 줄로 모은다. 눈이</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">갈 곳이 한 군데다.</text>
<text x="2000" y="614" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 띠는 실제 화면의 위쪽 끝에 붙어 좌우로</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">늘어난다. 왼쪽 묶음은 왼쪽 끝, 오른쪽 묶음은 오른쪽 끝,</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">알림은 가운데를 따라간다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 띠 안의 칸을 하나 빼거나</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">끼운다. 가운데 알림 칸이 줄어들며 받아 준다.</text>
<text x="2000" y="804" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 알림이 띠 안에 있어 공방 화면을 가리지 않는다. 긴</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">알림은 한 줄로 줄여야 한다.</text>
</svg>