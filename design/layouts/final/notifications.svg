<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#F2F2F2" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#F2F2F2" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="154.0" y="1392.0" width="78.0" height="198.0" fill="#E3E3E3" stroke="#8A8A8A" stroke-width="2"/><rect x="169.0" y="1416.0" width="48.0" height="28.8" fill="#8C8C8C" stroke="#222222" stroke-width="2"/><rect x="250.0" y="1377.0" width="90.0" height="69.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="355.0" y="1365.0" width="129.0" height="60.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="499.0" y="1365.0" width="90.0" height="69.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="322.0" y="1446.0" width="186.0" height="150.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1449.0" width="156.0" height="78.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1536.0" width="156.0" height="60.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="47.2" y="1324.8" width="138.0" height="21.6" fill="#F4F4F4" stroke="#222222" stroke-width="2"/><rect x="626.8" y="1324.8" width="66.0" height="21.6" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="696.4" y="1324.8" width="92.4" height="21.6" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="47.2" y="1617.6" width="39.6" height="21.6" fill="#8C8C8C" stroke="#222222" stroke-width="2"/><rect x="682.0" y="1350.0" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="682.0" y="1378.8" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="682.0" y="1407.6" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="682.0" y="1436.4" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="682.0" y="1465.2" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="682.0" y="1494.0" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="682.0" y="1522.8" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#F2F2F2" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#F2F2F2" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="964.0" y="1410.0" width="78.0" height="198.0" fill="#E3E3E3" stroke="#8A8A8A" stroke-width="2"/><rect x="979.0" y="1434.0" width="48.0" height="28.8" fill="#8C8C8C" stroke="#222222" stroke-width="2"/><rect x="1060.0" y="1395.0" width="90.0" height="69.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1165.0" y="1383.0" width="129.0" height="60.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1309.0" y="1383.0" width="90.0" height="69.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1132.0" y="1464.0" width="186.0" height="150.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1467.0" width="156.0" height="78.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1554.0" width="156.0" height="60.0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="947.2" y="1324.8" width="138.0" height="21.6" fill="#F4F4F4" stroke="#222222" stroke-width="2"/><rect x="1346.8" y="1324.8" width="66.0" height="21.6" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1416.4" y="1324.8" width="92.4" height="21.6" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="947.2" y="1653.6" width="39.6" height="21.6" fill="#8C8C8C" stroke="#222222" stroke-width="2"/><rect x="1402.0" y="1350.0" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1402.0" y="1378.8" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1402.0" y="1407.6" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1402.0" y="1436.4" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1402.0" y="1465.2" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1402.0" y="1494.0" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/><rect x="1402.0" y="1522.8" width="106.8" height="26.4" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#CFCFCF" stroke="#222222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">누를 수 있다 (구현됨)</text><rect x="2000" y="228" width="84" height="40" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#F4F4F4" stroke="#222222" stroke-width="2"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">읽기만 하는 정보 (구현됨)</text><rect x="2000" y="336" width="84" height="40" fill="#E3E3E3" stroke="#8A8A8A" stroke-width="2"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">방의 일부 (누르지 않는다)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리의 범위를 보이는 선 (화면에는 없다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 알림 한 건은 356×88, 사이는 8. 첫 건의 왼쪽 위는</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">(1540, 100). k번째 건의 위쪽은 100 + 96 × (k − 1).</text>
<text x="2000" y="614" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 오른쪽 끝을 보유 금액의 오른쪽 끝(1896)에 맞췄다. 왼쪽</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">끝 1540은 도구장의 오른쪽 끝(1530)보다 오른쪽이라</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">도구장을 가리지 않는다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 16:9: 3건까지는 어느 물건도 가리지 않는다. 4건째부터</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">완성작 선반의 오른쪽을, 7건째부터 판매 창구의 오른쪽을</text>
<text x="2000" y="794" font-size="24" text-anchor="start" fill="#111" font-weight="normal">가린다.</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 16:10: 알림은 위쪽 끝을 따라가고 물건은 60 내려가므로</text>
<text x="2000" y="872" font-size="24" text-anchor="start" fill="#111" font-weight="normal">한 건 늦다. 5건째부터 완성작 선반, 8건째부터 판매 창구.</text>
<text x="2000" y="916" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 21:9: 알림이 오른쪽 끝을 따라 300 더 나가므로 어느</text>
<text x="2000" y="950" font-size="24" text-anchor="start" fill="#111" font-weight="normal">물건도 가리지 않는다.</text>
<text x="2000" y="994" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 가리는 것은 물건의 오른쪽 300 너비뿐이다. 완성작 선반과</text>
<text x="2000" y="1028" font-size="24" text-anchor="start" fill="#111" font-weight="normal">판매 창구의 왼쪽 220은 늘 보인다.</text>
<text x="2000" y="1072" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 새 알림은 첫 자리(맨 위)에 뜨고 먼저 온 알림이 아래로</text>
<text x="2000" y="1106" font-size="24" text-anchor="start" fill="#111" font-weight="normal">밀린다. 그림의 번호는 자리의 번호다.</text>
</svg>