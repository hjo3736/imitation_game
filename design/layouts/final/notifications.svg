<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">확정 배치 — 알림이 여러 건 쌓인 모습</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">알림 7건을 그린 예시다. 한 번에 몇 건까지 보이는지는 정해지지 않았다(알림 기능을 만들 때 정한다).</text>
