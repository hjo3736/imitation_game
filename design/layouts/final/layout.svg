<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">확정 배치 — 공통 UI ① 네 모서리 + 공방 화면 ① 한 장의 방</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">사용자가 고친 판: 메뉴는 왼쪽 아래, 알림은 오른쪽 위 공통 UI 바로 아래. 회색조 배치도이며 숫자와 글자는 예시다.</text>
