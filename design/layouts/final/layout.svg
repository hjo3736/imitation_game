<rect x="1230" y="150" width="300" height="230" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="3" stroke-dasharray="14 8"/><text x="1380" y="257.36" font-size="28" text-anchor="middle" fill="#6E6E6E" font-weight="normal">도구장</text><text x="1380" y="291.04" font-size="24" text-anchor="middle" fill="#6E6E6E" font-weight="normal">준비 중</text>
