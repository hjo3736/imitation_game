<rect x="1356" y="16" width="220" height="72" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="3" stroke-dasharray="14 8"/><text x="1466" y="60.36" font-size="28" text-anchor="middle" fill="#6E6E6E" font-weight="normal">평판  -</text>
<rect x="1588" y="16" width="308" height="72" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="3" stroke-dasharray="14 8"/><text x="1742" y="60.36" font-size="28" text-anchor="middle" fill="#6E6E6E" font-weight="normal">보유 금액  -</text>
