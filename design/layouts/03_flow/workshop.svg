<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 3 — 공방 화면 ③ 흐름 구역</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">공방 화면 고유의 배치. 공통 UI의 자리는 비워 두고 윤곽만 그렸다. 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="0" y="0" width="1920" height="104" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="59.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (위 104)</text>
<rect x="0" y="984" width="1920" height="96" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="1039.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (아래 96)   ·   공통 UI ④(왼쪽 레일)를 고르면 왼쪽 200도 쓴다</text>
<rect x="40" y="112" width="380" height="864" fill="none" stroke="#888" stroke-width="2"/><text x="56" y="154" font-size="28" text-anchor="start" fill="#444" font-weight="normal">① 받기</text>
<rect x="445" y="112" width="520" height="864" fill="none" stroke="#888" stroke-width="2"/><text x="461" y="154" font-size="28" text-anchor="start" fill="#444" font-weight="normal">② 만들기</text>
<rect x="990" y="112" width="300" height="864" fill="none" stroke="#888" stroke-width="2"/><text x="1006" y="154" font-size="28" text-anchor="start" fill="#444" font-weight="normal">③ 보관</text>
<rect x="1315" y="112" width="300" height="864" fill="none" stroke="#888" stroke-width="2"/><text x="1331" y="154" font-size="28" text-anchor="start" fill="#444" font-weight="normal">④ 팔기</text>
<rect x="1640" y="112" width="240" height="864" fill="none" stroke="#888" stroke-width="2"/><text x="1656" y="154" font-size="28" text-anchor="start" fill="#444" font-weight="normal">그 밖</text>
<rect x="60" y="180" width="340" height="380" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="230" y="343.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">의뢰</text><text x="230" y="377.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">새 의뢰 표시</text><text x="230" y="411.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">의뢰 목록으로</text>
<rect x="60" y="580" width="340" height="376" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="230" y="775.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 선택으로</text>
<rect x="465" y="180" width="480" height="776" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="705" y="541.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">작업대</text><text x="705" y="575.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">진행 중인 작품</text><text x="705" y="609.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">공정 진행 표시</text>
<rect x="1010" y="180" width="260" height="776" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1140" y="558.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">완성작</text><text x="1140" y="592.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">보관함</text>
<rect x="1335" y="180" width="260" height="776" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1465" y="541.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매</text><text x="1465" y="575.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">경로 선택으로</text><text x="1465" y="609.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매 현황으로</text>
<rect x="1660" y="180" width="200" height="380" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1760" y="377.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">업그레이드로</text>
<rect x="1660" y="580" width="200" height="376" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="1760" y="758.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">문 · 명패</text><text x="1760" y="792.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(하루 끝내기)</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="40.0" y="1320.0" width="756.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="40.0" y="1615.2" width="756.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="142.0" y="1353.6" width="114.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="263.5" y="1353.6" width="156.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="427.0" y="1353.6" width="90.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="524.5" y="1353.6" width="90.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="622.0" y="1353.6" width="72.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="148.0" y="1374.0" width="102.0" height="114.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="148.0" y="1494.0" width="102.0" height="112.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="269.5" y="1374.0" width="144.0" height="232.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="433.0" y="1374.0" width="78.0" height="232.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="530.5" y="1374.0" width="78.0" height="232.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="628.0" y="1374.0" width="60.0" height="114.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="628.0" y="1494.0" width="60.0" height="112.8" fill="#8c8c8c" stroke="#222" stroke-width="2"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="940.0" y="1320.0" width="576.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="940.0" y="1651.2" width="576.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="952.0" y="1371.6" width="114.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="1073.5" y="1371.6" width="156.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="1237.0" y="1371.6" width="90.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="1334.5" y="1371.6" width="90.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="1432.0" y="1371.6" width="72.0" height="259.2" fill="none" stroke="#888" stroke-width="2"/><rect x="958.0" y="1392.0" width="102.0" height="114.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="958.0" y="1512.0" width="102.0" height="112.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1079.5" y="1392.0" width="144.0" height="232.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1243.0" y="1392.0" width="78.0" height="232.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1340.5" y="1392.0" width="78.0" height="232.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1438.0" y="1392.0" width="60.0" height="114.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1438.0" y="1512.0" width="60.0" height="112.8" fill="#8c8c8c" stroke="#222" stroke-width="2"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 화면을 작품 하나가 지나가는 순서대로 왼쪽에서</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">오른쪽으로 나눈다. 받기 → 만들기 → 보관 → 팔기. 화면이</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">곧 게임의 순환을 설명한다.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 하루의 움직임: 눈과 마우스가 왼쪽에서 오른쪽으로 한 번</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">흐르고, 다음 작품에서 다시 왼쪽으로 돌아온다. 하루</text>
<text x="2000" y="716" font-size="24" text-anchor="start" fill="#111" font-weight="normal">끝내기는 오른쪽 끝에 있다.</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 다섯 구역은 가운데에 고정된다. 넓어진 곳은</text>
<text x="2000" y="794" font-size="24" text-anchor="start" fill="#111" font-weight="normal">배경이 채운다.</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 흐름의 한 단계에 속하는 것은</text>
<text x="2000" y="872" font-size="24" text-anchor="start" fill="#111" font-weight="normal">그 구역에 쌓으면 된다. 흐름에 속하지 않는 것은 ‘그 밖’</text>
<text x="2000" y="906" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구역에 몰려 그 구역이 먼저 찬다.</text>
<text x="2000" y="950" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 구역의 너비가 고정이라, 한 구역의 내용이 많아지면(예:</text>
<text x="2000" y="984" font-size="24" text-anchor="start" fill="#111" font-weight="normal">보관함) 세로로 길어진다.</text>
</svg>