<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 3 — 공통 UI ③ 하단 띠</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">여러 화면에 걸쳐 늘 보이는 요소의 배치. 회색조 배치도이며 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="560" y="440" width="800" height="120" fill="none" stroke="#888" stroke-width="2"/><text x="960" y="509" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">공방 화면 (공방 시트에서 고른다)</text>
<rect x="0" y="992" width="1920" height="88" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
<rect x="24" y="1004" width="150" height="64" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="99" y="1043.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">1일차</text>
<rect x="186" y="1004" width="560" height="64" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="466" y="1043.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">남은 시간 9분 59초 ▬▬▬▬▬▬▬▬</text>
<rect x="770" y="1004" width="520" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1030" y="1043.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">알림이 한 줄씩 지나간다</text>
<rect x="1314" y="1004" width="200" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1414" y="1043.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">평판 00</text>
<rect x="1526" y="1004" width="266" height="64" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1659" y="1043.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">보유 금액 0,000 G</text>
<rect x="1804" y="1004" width="92" height="64" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="1850" y="1043.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">메뉴</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="298.0" y="1452.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="40.0" y="1617.6" width="756.0" height="26.4" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="47.2" y="1621.2" width="45.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="95.8" y="1621.2" width="168.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="361.0" y="1621.2" width="156.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="614.2" y="1621.2" width="60.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="677.8" y="1621.2" width="79.8" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="761.2" y="1621.2" width="27.6" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="1108.0" y="1470.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="940.0" y="1653.6" width="576.0" height="26.4" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="947.2" y="1657.2" width="45.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="995.8" y="1657.2" width="168.0" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="1171.0" y="1657.2" width="156.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1334.2" y="1657.2" width="60.0" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1397.8" y="1657.2" width="79.8" height="19.2" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1481.2" y="1657.2" width="27.6" height="19.2" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 정보를 아래쪽 띠에 두고 위쪽을 통째로 비운다.</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">남은 시간을 긴 막대로 그려 하루가 줄어드는 것이 보이게</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">한다.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 띠는 실제 화면의 아래쪽 끝에 붙어 좌우로</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">늘어난다. 16:10에서는 60만큼 내려간다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 띠 안의 칸을 하나 빼거나</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">끼운다. 시간 막대와 알림 칸이 줄어들며 받아 준다.</text>
<text x="2000" y="804" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 마우스가 주로 아래쪽에 머무는 화면(아래에 버튼이 많은</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공방)과 함께 쓰면 손이 덜 움직인다.</text>
</svg>