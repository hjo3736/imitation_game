<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 4 — 공통 UI ④ 왼쪽 레일</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">여러 화면에 걸쳐 늘 보이는 요소의 배치. 회색조 배치도이며 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="560" y="480" width="800" height="120" fill="none" stroke="#888" stroke-width="2"/><text x="960" y="549" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">공방 화면 (공방 시트에서 고른다)</text>
<rect x="0" y="0" width="200" height="1080" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
<rect x="16" y="16" width="168" height="72" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="100" y="59.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">1일차</text>
<rect x="16" y="104" width="168" height="380" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="100" y="267.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">남은 시간</text><text x="100" y="301.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">9분 59초</text><text x="100" y="335.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(세로 막대)</text>
<rect x="16" y="500" width="168" height="88" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="100" y="534.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">보유 금액</text><text x="100" y="568.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">0,000 G</text>
<rect x="16" y="604" width="168" height="88" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="100" y="638.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">평판</text><text x="100" y="672.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">00</text>
<rect x="16" y="708" width="168" height="88" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="100" y="759.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">알림 (0)</text>
<rect x="216" y="708" width="440" height="88" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="436" y="742.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">알림 내용이 옆으로 펼쳐진다</text><text x="436" y="776.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(뜰 때만 보인다)</text>
<rect x="16" y="976" width="168" height="88" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="100" y="1027.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">메뉴</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="298.0" y="1464.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="40.0" y="1320.0" width="60.0" height="324.0" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="44.8" y="1324.8" width="50.4" height="21.6" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="44.8" y="1351.2" width="50.4" height="114.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="44.8" y="1470.0" width="50.4" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="44.8" y="1501.2" width="50.4" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="44.8" y="1532.4" width="50.4" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="104.8" y="1532.4" width="132.0" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="44.8" y="1612.8" width="50.4" height="26.4" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="1108.0" y="1482.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="940.0" y="1320.0" width="60.0" height="360.0" fill="#f2f2f2" stroke="#888" stroke-width="2"/><rect x="944.8" y="1324.8" width="50.4" height="21.6" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="944.8" y="1351.2" width="50.4" height="114.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="944.8" y="1470.0" width="50.4" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="944.8" y="1501.2" width="50.4" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="944.8" y="1532.4" width="50.4" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1004.8" y="1532.4" width="132.0" height="26.4" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="944.8" y="1648.8" width="50.4" height="26.4" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 왼쪽에 세로 기둥을 세워 정보를 위에서 아래로</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">쌓는다. 남은 시간은 세로 막대로 줄어든다. 공방은 그</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">오른쪽 전부를 쓴다.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 기둥은 실제 화면의 왼쪽 끝에 붙어 위아래로</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">늘어난다. 21:9에서는 기둥과 공방 사이가 벌어진다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 기둥에 칸을 하나 빼거나</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">쌓는다. 시간 막대의 길이가 줄어들며 받아 준다.</text>
<text x="2000" y="804" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 알림은 기둥의 칸에서 오른쪽으로 펼쳐지므로, 뜨는 동안</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공방의 왼쪽 일부를 가린다.</text>
<text x="2000" y="882" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 공방이 쓸 수 있는 너비가 200 줄어든다. 공방 시트 ④는</text>
<text x="2000" y="916" font-size="24" text-anchor="start" fill="#111" font-weight="normal">이 기둥을 전제로 그렸다.</text>
</svg>