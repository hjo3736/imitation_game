<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 4 — 공방 화면 ④ 작업대 중심</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">공방 화면 고유의 배치. 공통 UI의 자리는 비워 두고 윤곽만 그렸다. 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="0" y="0" width="1920" height="104" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="59.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (위 104)</text>
<rect x="0" y="984" width="1920" height="96" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="1039.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (아래 96)   ·   공통 UI ④(왼쪽 레일)를 고르면 왼쪽 200도 쓴다</text>
<rect x="224" y="112" width="1340" height="660" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="894" y="412" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">작업대 — 진행 중인 작품을 크게 보여 준다</text><text x="894" y="451" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">공정 진행 표시</text><text x="894" y="490" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">[ 작업 이어 하기 ]</text>
<rect x="1588" y="112" width="292" height="660" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="1734" y="432.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">문 · 명패</text><text x="1734" y="466.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(하루 끝내기)</text>
<rect x="224" y="800" width="312" height="176" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="380" y="878.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">의뢰</text><text x="380" y="912.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(새 의뢰 표시)</text>
<rect x="560" y="800" width="312" height="176" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="716" y="895.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 선택</text>
<rect x="896" y="800" width="312" height="176" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1052" y="895.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">완성작 보관함</text>
<rect x="1232" y="800" width="312" height="176" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1388" y="895.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매</text>
<rect x="1568" y="800" width="312" height="176" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1724" y="895.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">업그레이드</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="40.0" y="1320.0" width="756.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="40.0" y="1615.2" width="756.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="197.2" y="1353.6" width="402.0" height="198.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="606.4" y="1353.6" width="87.6" height="198.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="197.2" y="1560.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="298.0" y="1560.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="398.8" y="1560.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="499.6" y="1560.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="600.4" y="1560.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="940.0" y="1320.0" width="576.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="940.0" y="1651.2" width="576.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="1007.2" y="1371.6" width="402.0" height="198.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1416.4" y="1371.6" width="87.6" height="198.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="1007.2" y="1578.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1108.0" y="1578.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1208.8" y="1578.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1309.6" y="1578.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1410.4" y="1578.0" width="93.6" height="52.8" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 공방의 주인공은 지금 만들고 있는 작품 하나다.</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">작업대를 화면의 대부분으로 키우고, 나머지는 아래에 한 줄의</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">큰 버튼으로 모은다.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 하루의 움직임: 눈은 가운데 작품에 머물고, 마우스는 아래</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">줄에서 좌우로만 움직인다. 버튼의 순서가 곧 작업의 순서다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 작업대와 버튼 줄은 가운데에 고정된다. 넓어진</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">곳은 배경이 채운다.</text>
<text x="2000" y="804" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 아래 줄의 버튼을 하나 빼거나</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">끼우고 너비를 다시 나눈다. 일곱 개까지는 한 줄에</text>
<text x="2000" y="872" font-size="24" text-anchor="start" fill="#111" font-weight="normal">들어간다.</text>
<text x="2000" y="916" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 왼쪽 200을 비워 두었다(공통 UI ④의 자리). 다른 공통</text>
<text x="2000" y="950" font-size="24" text-anchor="start" fill="#111" font-weight="normal">UI와 쓸 때는 전체를 왼쪽으로 100 옮겨 가운데에 맞춘다.</text>
<text x="2000" y="994" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 아래 줄의 버튼에는 상태를 한두 마디밖에 적지 못한다.</text>
<text x="2000" y="1028" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자세한 것은 들어가서 본다.</text>
</svg>