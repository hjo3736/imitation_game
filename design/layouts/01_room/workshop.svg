<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 1 — 공방 화면 ① 한 장의 방</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">공방 화면 고유의 배치. 공통 UI의 자리는 비워 두고 윤곽만 그렸다. 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="0" y="0" width="1920" height="104" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="59.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (위 104)</text>
<rect x="0" y="984" width="1920" height="96" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="960" y="1039.3" font-size="24" text-anchor="middle" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (아래 96)   ·   공통 UI ④(왼쪽 레일)를 고르면 왼쪽 200도 쓴다</text>
<rect x="80" y="240" width="260" height="660" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="210" y="560.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">문</text><text x="210" y="594.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">(하루 끝내기)</text>
<rect x="130" y="320" width="160" height="96" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="210" y="375.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">명패</text>
<rect x="400" y="190" width="300" height="230" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="550" y="278.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">의뢰 게시판</text><text x="550" y="312.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">새 의뢰 표시</text><text x="550" y="346.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">의뢰 목록으로</text>
<rect x="750" y="150" width="430" height="200" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="965" y="240.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 화집 선반</text><text x="965" y="274.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">원작 선택으로</text>
<rect x="1230" y="150" width="300" height="230" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1380" y="255.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">도구장</text><text x="1380" y="289.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">업그레이드로</text>
<rect x="640" y="420" width="620" height="500" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="950" y="643.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">작업대 (이젤)</text><text x="950" y="677.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">진행 중인 작품</text><text x="950" y="711.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">공정 진행 표시</text>
<rect x="1320" y="430" width="520" height="260" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1580" y="567.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">완성작 보관함 (선반)</text>
<rect x="1320" y="720" width="520" height="200" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1580" y="810.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매 창구</text><text x="1580" y="844.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">판매 경로 선택으로 · 판매 현황으로</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="40.0" y="1320.0" width="756.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="40.0" y="1615.2" width="756.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="154.0" y="1392.0" width="78.0" height="198.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="169.0" y="1416.0" width="48.0" height="28.8" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="250.0" y="1377.0" width="90.0" height="69.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="355.0" y="1365.0" width="129.0" height="60.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="499.0" y="1365.0" width="90.0" height="69.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="322.0" y="1446.0" width="186.0" height="150.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1449.0" width="156.0" height="78.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="526.0" y="1536.0" width="156.0" height="60.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="940.0" y="1320.0" width="576.0" height="31.2" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="940.0" y="1651.2" width="576.0" height="28.8" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><rect x="964.0" y="1410.0" width="78.0" height="198.0" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="979.0" y="1434.0" width="48.0" height="28.8" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="1060.0" y="1395.0" width="90.0" height="69.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1165.0" y="1383.0" width="129.0" height="60.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1309.0" y="1383.0" width="90.0" height="69.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1132.0" y="1464.0" width="186.0" height="150.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1467.0" width="156.0" height="78.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1336.0" y="1554.0" width="156.0" height="60.0" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 공방을 한 장의 방으로 보고, 방 안의 물건을 눌러</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">들어간다. 문, 게시판, 선반, 이젤, 도구장이 곧 입구다.</text>
<text x="2000" y="614" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 하루의 움직임: 왼쪽 문 옆 게시판에서 의뢰를 보고,</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">가운데 이젤에서 만들고, 오른쪽 선반과 창구로 넘긴다.</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">하루가 끝나면 다시 왼쪽 문으로 간다.</text>
<text x="2000" y="726" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 물건은 모두 보장 영역 안에 있고 가운데에</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">고정된다. 넓어진 곳은 방의 벽과 바닥(배경)이 채운다.</text>
<text x="2000" y="804" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 물건 하나를 치우거나 놓는다.</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">방에 빈 벽이 남아 있어 두세 개까지는 받는다. 그 이상이면</text>
<text x="2000" y="872" font-size="24" text-anchor="start" fill="#111" font-weight="normal">방이 비좁다.</text>
<text x="2000" y="916" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 물건의 상자는 누를 수 있는 범위다. 그림을 입힐 때</text>
<text x="2000" y="950" font-size="24" text-anchor="start" fill="#111" font-weight="normal">그림이 이 범위를 따라야 한다.</text>
</svg>