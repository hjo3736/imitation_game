<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1700" width="2760" height="1700" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="2760" height="1700" fill="#ffffff"/>
<text x="40" y="62" font-size="44" text-anchor="start" fill="#111" font-weight="bold">시안 1 — 공통 UI ① 네 모서리</text>
<text x="40" y="104" font-size="26" text-anchor="start" fill="#444" font-weight="normal">여러 화면에 걸쳐 늘 보이는 요소의 배치. 회색조 배치도이며 숫자와 글자는 자리를 보여 주는 예시다.</text>
<g transform="translate(40,130)">
<rect x="0" y="0" width="1920" height="1080" fill="#fafafa"/>
<rect x="560" y="480" width="800" height="120" fill="none" stroke="#888" stroke-width="2"/><text x="960" y="549" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">공방 화면 (공방 시트에서 고른다)</text>
<rect x="24" y="16" width="420" height="72" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="234" y="59.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">1일차 · 남은 시간 9분 59초</text>
<rect x="1356" y="16" width="220" height="72" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1466" y="59.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">평판 00</text>
<rect x="1588" y="16" width="308" height="72" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="1742" y="59.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">보유 금액 0,000 G</text>
<rect x="24" y="996" width="480" height="72" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="264" y="1039.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">알림 (예: 판매 완료)</text>
<rect x="1764" y="996" width="132" height="72" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="1830" y="1039.7" font-size="26" text-anchor="middle" fill="#111" font-weight="normal">메뉴</text>
<rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-width="4"/>
</g>
<text x="1960" y="1244" font-size="24" text-anchor="end" fill="#444" font-weight="normal">굵은 테두리 = 보장 영역 1920×1080 (16:9에서는 화면 전체)</text>
<text x="40" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9 (2520×1080) — 점선이 보장 영역, 바깥은 배경</text><rect x="40" y="1320" width="756" height="324" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="130" y="1320" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="298.0" y="1464.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="47.2" y="1324.8" width="126.0" height="21.6" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="626.8" y="1324.8" width="66.0" height="21.6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="696.4" y="1324.8" width="92.4" height="21.6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="47.2" y="1618.8" width="144.0" height="21.6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="749.2" y="1618.8" width="39.6" height="21.6" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="940" y="1306" font-size="24" text-anchor="start" fill="#111" font-weight="normal">16:10 (1920×1200) — 위아래로 60씩 넓어진다</text><rect x="940" y="1320" width="576" height="360" fill="#e4e4e4" stroke="#222" stroke-width="3"/><rect x="940" y="1338" width="576" height="324" fill="#fafafa" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/><rect x="1108.0" y="1482.0" width="240.0" height="36.0" fill="none" stroke="#888" stroke-width="2"/><rect x="947.2" y="1324.8" width="126.0" height="21.6" fill="#8c8c8c" stroke="#222" stroke-width="2"/><rect x="1346.8" y="1324.8" width="66.0" height="21.6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1416.4" y="1324.8" width="92.4" height="21.6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="947.2" y="1654.8" width="144.0" height="21.6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="1469.2" y="1654.8" width="39.6" height="21.6" fill="#8c8c8c" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="2000" y="154" font-size="28" text-anchor="start" fill="#111" font-weight="bold">표시</text><rect x="2000" y="174" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="4"/><text x="2100" y="203" font-size="24" text-anchor="start" fill="#111" font-weight="normal">구현됨 (지금 동작한다)</text><rect x="2000" y="228" width="84" height="40" fill="#ffffff" stroke="#555" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="257" font-size="24" text-anchor="start" fill="#111" font-weight="normal">자리만 (눌러도 동작하지 않는다)</text><rect x="2000" y="282" width="84" height="40" fill="#cfcfcf" stroke="#222" stroke-width="3" stroke-dasharray="14 8"/><text x="2100" y="311" font-size="24" text-anchor="start" fill="#111" font-weight="normal">기능은 구현됨, 화면의 버튼은 새로 만든다</text><rect x="2000" y="336" width="84" height="40" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="4 6"/><text x="2100" y="365" font-size="24" text-anchor="start" fill="#111" font-weight="normal">공통 UI가 놓일 자리 (공방 시트)</text><rect x="2000" y="390" width="84" height="40" fill="none" stroke="#888" stroke-width="2"/><text x="2100" y="419" font-size="24" text-anchor="start" fill="#111" font-weight="normal">묶음의 테두리 (요소가 아니다)</text>
<text x="2000" y="494" font-size="28" text-anchor="start" fill="#111" font-weight="bold">메모</text>
<text x="2000" y="536" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 생각: 화면 가운데를 비우고 정보를 네 모서리에 작게 나눠</text>
<text x="2000" y="570" font-size="24" text-anchor="start" fill="#111" font-weight="normal">둔다. 왼쪽 위는 시간, 오른쪽 위는 돈과 평판, 왼쪽 아래는</text>
<text x="2000" y="604" font-size="24" text-anchor="start" fill="#111" font-weight="normal">알림, 오른쪽 아래는 메뉴.</text>
<text x="2000" y="648" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 화면비: 네 덩어리가 각자의 모서리를 따라간다.</text>
<text x="2000" y="682" font-size="24" text-anchor="start" fill="#111" font-weight="normal">21:9에서는 좌우로 300씩, 16:10에서는 위아래로 60씩</text>
<text x="2000" y="716" font-size="24" text-anchor="start" fill="#111" font-weight="normal">벌어진다.</text>
<text x="2000" y="760" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 요소가 빠지거나 더해지면: 모서리의 덩어리 안에서 옆으로</text>
<text x="2000" y="794" font-size="24" text-anchor="start" fill="#111" font-weight="normal">줄이거나 늘린다. 한 모서리에 셋을 넘기면 좁아진다.</text>
<text x="2000" y="838" font-size="24" text-anchor="start" fill="#111" font-weight="normal">· 알림이 몇 건까지 쌓여 보이는지는 정해지지 않았다. 한</text>
<text x="2000" y="872" font-size="24" text-anchor="start" fill="#111" font-weight="normal">건의 자리만 그렸다.</text>
</svg>